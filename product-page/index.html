<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavi Series — MERO</title>
<meta name="description" content="Mavi Series fiberglass planter — PKR 34,500. Bold presence, smooth seamless curves, indoor or outdoor.">
<link rel="preload" href="assets/fonts/jost-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Jost stands in for Futura, the face used throughout the MERO storefront;
     Cormorant Garamond italic covers the "series" lockup on the hero. */
  @font-face{
    font-family:"Jost";
    src:url("assets/fonts/jost-latin-var.woff2") format("woff2-variations"),
        url("assets/fonts/jost-latin-var.woff2") format("woff2");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Cormorant Garamond";
    src:url("assets/fonts/cormorant-garamond-italic-latin-var.woff2") format("woff2-variations"),
        url("assets/fonts/cormorant-garamond-italic-latin-var.woff2") format("woff2");
    font-weight:300 700;
    font-style:italic;
    font-display:swap;
  }
  :root{
    --taupe:#b1a59c;
    --ink:#222222;
    --price:#464646;
    --muted:#898989;
    --line:#e4e4e4;
    --line-soft:#eeeeee;
    --field:#f6f6f6;
    --page:#ffffff;
    --sans:"Futura","Futura PT","Futura Std","Jost","Century Gothic",system-ui,sans-serif;
    --serif:"Cormorant Garamond","EB Garamond",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--page);
    color:var(--price);
    font-family:var(--sans);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ---------- announcement bar ---------- */
  .announce{
    background:var(--taupe);
    color:#fff;
    text-align:center;
    padding:13.5px 16px;
    font-size:19px;
    line-height:1;
    letter-spacing:.158em;
  }
  .announce a{text-decoration:underline;text-underline-offset:3px}

  /* ---------- header ---------- */
  .shell{max-width:1440px;margin:0 auto;padding:0 80px}
  .masthead{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:26px 0 4px;
  }
  .masthead .icon-left{justify-self:start}
  .masthead .icon-right{justify-self:end}
  .logo img{width:140px;height:auto}
  .icon-btn{display:inline-flex;color:var(--muted)}
  .icon-btn svg{width:30px;height:30px;stroke:currentColor;stroke-width:1.4;fill:none}

  .nav{
    display:flex;
    justify-content:center;
    gap:42px;
    padding:36px 0 30px;
  }
  .nav a{
    display:inline-block;
    line-height:1;
    font-size:21px;
    font-weight:400;
    letter-spacing:.115em;
    color:var(--muted);
    padding-bottom:4px;
  }
  .nav a:hover{color:var(--ink)}
  .nav a.is-active{color:var(--ink);border-bottom:1px solid var(--ink)}

  /* ---------- product layout ---------- */
  .product{
    display:grid;
    grid-template-columns:496px 1fr;
    column-gap:126px;
    align-items:start;
    padding:61px 0 90px;
  }

  /* left column */
  .info-col{margin-top:8px}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .product-title{
    margin:0;
    font-size:40px;
    font-weight:300;
    letter-spacing:.146em;
    line-height:1.1;
    color:var(--muted);
    text-transform:uppercase;
  }
  .wish-plain{color:var(--muted);flex:none;margin-top:6px}
  .wish-plain svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.3;fill:none}
  .wish-plain.is-on svg{fill:currentColor}

  .price-row{display:flex;align-items:baseline;gap:11px;margin-top:20px}
  .price{font-size:21px;font-weight:500;letter-spacing:.08em;color:var(--price);margin:0}
  .sku{font-size:15px;letter-spacing:.04em;color:var(--muted)}

  .swatches{display:flex;gap:18px;margin-top:26px}
  .swatch{
    width:39px;height:39px;border-radius:50%;
    border:1px solid transparent;
    position:relative;
    transition:box-shadow .15s ease;
  }
  /* selection reads as an inset ring so the row keeps its height */
  .swatch[aria-pressed="true"]{
    box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(0,0,0,.35);
  }
  .swatch[data-tone="white"]{border-color:#dcdcdc}
  .swatch[data-tone="white"][aria-pressed="true"]{
    box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(0,0,0,.25);
  }
  .swatch:focus-visible{outline:1px solid #8a8a8a;outline-offset:4px}

  .installments{margin-top:39px}
  .label{
    font-size:15px;
    letter-spacing:.07em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .banks{display:flex;align-items:center;gap:14px;margin-top:5px}
  .bank{display:flex;align-items:center;gap:7px}
  .bank img{height:21px;width:auto}
  .bank img.alfalah{height:19px}
  .info{
    width:17px;height:17px;border-radius:50%;border:1px solid var(--muted);
    color:var(--muted);font-size:11px;line-height:15px;text-align:center;
    font-family:var(--serif);font-style:italic;
  }

  .buy-row{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    margin-top:50px;
  }
  .qty{display:flex;border:1px solid var(--line)}
  .qty button{
    width:50px;height:53px;font-size:22px;font-weight:300;color:var(--muted);
    display:grid;place-items:center;
  }
  .qty button[disabled]{color:#dcdcdc;cursor:default}
  .qty button:last-child{background:var(--field)}
  .qty input{
    width:52px;height:53px;border:1px solid var(--ink);border-top:0;border-bottom:0;
    text-align:center;font-family:var(--sans);font-size:18px;color:var(--price);
    background:#fff;-moz-appearance:textfield;
  }
  .qty input::-webkit-outer-spin-button,
  .qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .line-price{text-align:right;line-height:1.35}
  .line-price .amount{font-size:22px;font-weight:500;letter-spacing:.07em;color:var(--price)}
  .line-price .each{font-size:15px;color:var(--muted)}

  .cart-row{display:flex;gap:9px;margin-top:18px}
  .add-to-cart{
    flex:1;
    background:var(--ink);
    color:#fff;
    height:60px;
    font-size:18px;
    font-weight:500;
    letter-spacing:.14em;
    transition:background .18s ease;
  }
  .add-to-cart:hover{background:#000}
  .wish-box{
    width:67px;height:60px;border:1px solid var(--ink);
    display:grid;place-items:center;color:var(--ink);
  }
  .wish-box svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.3;fill:none}
  .wish-box.is-on svg{fill:currentColor}

  .details{margin-top:35px;padding-top:22px;border-top:1px solid var(--line-soft)}
  .details h2{
    margin:0 0 12px;
    font-size:15px;font-weight:400;letter-spacing:.07em;
    color:var(--muted);text-transform:uppercase;
  }
  .details p{
    margin:0;
    font-size:15px;
    line-height:1.28;
    letter-spacing:.063em;
    color:var(--muted);
    text-align:justify;
  }

  /* ---------- gallery ---------- */
  .gallery{display:grid;grid-template-columns:1fr 116px;column-gap:19px;align-items:start}
  /* the rail is taken out of flow so the square stage alone sets the row height */
  .rail-cell{position:relative;align-self:stretch}
  .stage{position:relative;aspect-ratio:1/1;overflow:hidden;background:#f0ebe3}
  .stage img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .5s ease;
  }
  .stage img.is-active{opacity:1}
  .stage-caption{
    position:absolute;top:8%;left:0;right:0;text-align:center;
    color:#5b5b5b;pointer-events:none;
    transition:opacity .35s ease;
  }
  .stage-caption .name{
    display:block;font-size:75px;font-weight:300;letter-spacing:.1em;line-height:1;
    text-transform:uppercase;text-indent:.1em;
  }
  .stage-caption .sub{
    display:block;font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:38px;margin-top:2px;
  }
  .stage-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:42px;height:42px;display:grid;place-items:center;
    color:#5b5b5b;background:rgba(255,255,255,.72);border-radius:50%;
    opacity:0;transition:opacity .2s ease;
  }
  .stage:hover .stage-nav,.stage-nav:focus-visible{opacity:1}
  .stage-nav.prev{left:14px}
  .stage-nav.next{right:14px}
  .stage-nav svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}

  /* grid/flex items default to min-width:auto, which lets the thumb rail
     blow out the track on narrow screens */
  .product > *, .gallery > *{min-width:0}
  .rail{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;min-width:0}
  .thumbs{
    display:flex;flex-direction:column;gap:14px;
    flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;
    scrollbar-width:none;
  }
  .thumbs::-webkit-scrollbar{display:none}
  .thumb{flex:0 0 auto}
  .thumb{
    aspect-ratio:1/1;overflow:hidden;background:#f0ebe3;
    border:1px solid transparent;transition:border-color .2s ease;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb[aria-current="true"]{border-color:#c9c2b8}

  .upload{
    flex:0 0 auto;
    margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    height:34px;
    border:1px dashed #cfcfcf;
    color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    cursor:pointer;
    transition:border-color .2s ease,color .2s ease;
  }
  .upload:hover{border-color:var(--muted);color:var(--price)}
  .upload svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.5;fill:none}
  .upload input{display:none}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- responsive ---------- */
  @media (max-width:1180px){
    .shell{padding:0 40px}
    .product{grid-template-columns:1fr 1fr;column-gap:56px}
  }
  @media (max-width:900px){
    .product{grid-template-columns:1fr;row-gap:48px}
    .gallery{order:-1}
    .nav{gap:28px}
    .nav a{font-size:17px}
  }
  @media (max-width:620px){
    .shell{padding:0 16px}
    .announce{font-size:11px;letter-spacing:.03em;padding:11px 14px}
    .nav{gap:13px;flex-wrap:wrap;justify-content:center}
    .nav a{font-size:13px;letter-spacing:.08em}
    .product-title{font-size:30px}
    .stage-caption .name{font-size:46px}
    .stage-caption .sub{font-size:24px}
    .gallery{grid-template-columns:1fr;row-gap:14px}
    .rail-cell{position:static}
    .rail{position:static;height:auto}
    .thumbs{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
    .thumb{flex:0 0 86px}
    .upload{margin-top:12px;height:34px}
    .buy-row{flex-wrap:wrap}
  }
</style>
</head>
<body>

<div class="announce">
  SAVE 15% OFF FIRST ORDER.*USE CODE :HELLO15 <a href="#shop">SHOP NOW</a>
</div>

<header class="shell">
  <div class="masthead">
    <button class="icon-btn icon-left" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    </button>
    <a class="logo" href="#home" aria-label="MERO home">
      <img src="assets/mero-logo.png" alt="MERO">
    </a>
    <button class="icon-btn icon-right" aria-label="Cart">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l1.2 11.5H4.8L6 8Z"/><path d="M9 8V6.2A3 3 0 0 1 15 6.2V8"/></svg>
    </button>
  </div>
  <nav class="nav">
    <a href="#outdoor">OUTDOOR</a>
    <a href="#lighting">LIGHTING</a>
    <a href="#furniture">FURNITURE</a>
    <a href="#decor">DECOR</a>
    <a href="#sale" class="is-active">SALE</a>
  </nav>
</header>

<main class="shell">
  <div class="product">

    <!-- ============ left column ============ -->
    <section class="info-col">
      <div class="title-row">
        <h1 class="product-title" id="p-title">Mavi Series</h1>
        <button class="wish-plain" id="wish-top" aria-label="Add to wishlist" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 20.3 4.6 13a4.4 4.4 0 0 1 6.2-6.2l1.2 1.2 1.2-1.2A4.4 4.4 0 1 1 19.4 13Z"/></svg>
        </button>
      </div>

      <div class="price-row">
        <p class="price" id="p-price">PKR 34,500</p>
        <span class="sku" id="p-sku">SKU:646724_MERO</span>
      </div>

      <div class="swatches" id="p-swatches" role="group" aria-label="Colour"></div>

      <div class="installments">
        <span class="label">Buy on installments</span>
        <div class="banks">
          <span class="bank"><img src="assets/hbl.png" alt="HBL"><span class="info" title="HBL installment plans">i</span></span>
          <span class="bank"><img class="alfalah" src="assets/alfalah.png" alt="Bank Alfalah"><span class="info" title="Bank Alfalah installment plans">i</span></span>
        </div>
      </div>

      <div class="buy-row">
        <div class="qty">
          <button type="button" id="qty-down" aria-label="Decrease quantity">&minus;</button>
          <label class="sr-only" for="qty">Quantity</label>
          <input id="qty" type="number" inputmode="numeric" min="1" value="1">
          <button type="button" id="qty-up" aria-label="Increase quantity">+</button>
        </div>
        <div class="line-price">
          <div class="amount" id="p-line-price">PKR 34,500</div>
          <div class="each">each</div>
        </div>
      </div>

      <div class="cart-row">
        <button class="add-to-cart" id="add-to-cart">ADD TO CART</button>
        <button class="wish-box" id="wish-box" aria-label="Add to wishlist" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 20.3 4.6 13a4.4 4.4 0 0 1 6.2-6.2l1.2 1.2 1.2-1.2A4.4 4.4 0 1 1 19.4 13Z"/></svg>
        </button>
      </div>

      <div class="details">
        <h2>Details</h2>
        <p id="p-details"></p>
      </div>
    </section>

    <!-- ============ gallery ============ -->
    <section class="gallery" aria-label="Product images">
      <div class="stage" id="stage">
        <div class="stage-caption" id="stage-caption">
          <span class="name" id="caption-name">Mavi</span>
          <span class="sub" id="caption-sub">series</span>
        </div>
        <button class="stage-nav prev" id="slide-prev" aria-label="Previous image">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button class="stage-nav next" id="slide-next" aria-label="Next image">
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="rail-cell"><div class="rail">
        <div class="thumbs" id="thumbs"></div>
        <label class="upload">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3h16v-3"/></svg>
          Add photo
          <input type="file" id="upload-input" accept="image/*" multiple>
        </label>
      </div></div>
    </section>

  </div>
</main>

<script>
/* ------------------------------------------------------------------
   Catalogue. Each product owns its own image set, so the gallery can
   cycle a product's photos and then move on to the next product.
------------------------------------------------------------------ */
const PRODUCTS = [
  {
    id: "mavi",
    title: "Mavi Series",
    captionName: "Mavi",
    captionSub: "series",
    price: 34500,
    sku: "646724_MERO",
    colors: [
      { name: "Black", hex: "#0a0909" },
      { name: "White", hex: "#f7f7f7", tone: "white" },
      { name: "Grey",  hex: "#828282" }
    ],
    details: "Our signature Mavi Planter; where it all started. For design lovers! " +
      "With its bold presence, smooth seamless curves, and flawlessly finished surface, " +
      "this rounded fiberglass planter brings character and elevates elegance in any space, " +
      "indoors or outdoors. Features: Used Indoor/ Outdoor Drainage Hole Hand Made " +
      "UV Resistant Weather Resistant UV Resistant",
    images: [
      { src: "assets/mavi-white.jpg", alt: "Mavi planter in white" },
      { src: "assets/mavi-black.jpg", alt: "Mavi planter in black" },
      { src: "assets/mavi-black-plant.jpg", alt: "Mavi planter in black with palm" },
      { src: "assets/mavi-grey.jpg", alt: "Mavi planter in grey" },
      { src: "assets/mavi-black-plant-close.jpg", alt: "Close view of the Mavi planter with palm" }
    ]
  }
];

/* The stage cycles a product's photos, then hands over to the next product.
   Set AUTOPLAY to false to leave the gallery under the shopper's control. */
const AUTOPLAY = true;
const SLIDE_MS = 4000;
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const els = {
  title: document.getElementById("p-title"),
  price: document.getElementById("p-price"),
  linePrice: document.getElementById("p-line-price"),
  sku: document.getElementById("p-sku"),
  swatches: document.getElementById("p-swatches"),
  details: document.getElementById("p-details"),
  stage: document.getElementById("stage"),
  captionName: document.getElementById("caption-name"),
  captionSub: document.getElementById("caption-sub"),
  thumbs: document.getElementById("thumbs"),
  qty: document.getElementById("qty"),
  upload: document.getElementById("upload-input")
};

let productIndex = 0;
let slideIndex = 0;
let timer = null;
let autoplay = AUTOPLAY && !REDUCED_MOTION;
const uploaded = [];            // object URLs to revoke on unload

const product = () => PRODUCTS[productIndex];
const money = n => "PKR " + n.toLocaleString("en-US");

/* ---------- rendering ---------- */

function renderProduct() {
  const p = product();
  els.title.textContent = p.title;
  els.price.textContent = money(p.price);
  els.sku.textContent = "SKU:" + p.sku;
  els.details.textContent = p.details;
  els.captionName.textContent = p.captionName;
  els.captionSub.textContent = p.captionSub;

  els.swatches.innerHTML = "";
  p.colors.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.background = c.hex;
    if (c.tone) b.dataset.tone = c.tone;
    b.setAttribute("aria-label", c.name);
    b.setAttribute("aria-pressed", String(i === 0));
    b.addEventListener("click", () => {
      [...els.swatches.children].forEach(s =>
        s.setAttribute("aria-pressed", String(s === b)));
    });
    els.swatches.appendChild(b);
  });

  renderImages();
  updateLinePrice();
}

function renderImages() {
  const p = product();

  els.stage.querySelectorAll("img").forEach(img => img.remove());
  const frag = document.createDocumentFragment();
  p.images.forEach((im, i) => {
    const img = document.createElement("img");
    img.src = im.src;
    img.alt = im.alt || p.title;
    img.loading = i === 0 ? "eager" : "lazy";
    frag.appendChild(img);
  });
  // keep the caption on top of the stack
  els.stage.insertBefore(frag, els.stage.firstChild);

  els.thumbs.innerHTML = "";
  p.images.forEach((im, i) => {
    const b = document.createElement("button");
    b.className = "thumb";
    b.innerHTML = `<img src="${im.src}" alt="">`;
    b.setAttribute("aria-label", `View image ${i + 1}`);
    b.addEventListener("click", () => { stopAuto(); showSlide(i); });
    els.thumbs.appendChild(b);
  });

  showSlide(Math.min(slideIndex, p.images.length - 1));
}

function showSlide(i) {
  const imgs = els.stage.querySelectorAll("img");
  if (!imgs.length) return;
  slideIndex = (i + imgs.length) % imgs.length;
  imgs.forEach((img, n) => img.classList.toggle("is-active", n === slideIndex));
  [...els.thumbs.children].forEach((t, n) =>
    t.setAttribute("aria-current", String(n === slideIndex)));
  // The MAVI/series lockup belongs to the opening shot only.
  els.stage.querySelector(".stage-caption").style.opacity = slideIndex === 0 ? "1" : "0";
}

function updateLinePrice() {
  const n = Math.max(1, parseInt(els.qty.value, 10) || 1);
  els.qty.value = n;
  els.linePrice.textContent = money(product().price * n);
  document.getElementById("qty-down").disabled = n <= 1;
}

/* ---------- slider control ---------- */

function nextSlide() {
  const last = product().images.length - 1;
  if (slideIndex >= last) {
    nextProduct();          // done with this product — move to the next
  } else {
    showSlide(slideIndex + 1);
  }
}

function prevSlide() { showSlide(slideIndex - 1); }

function nextProduct() {
  if (PRODUCTS.length < 2) { showSlide(0); return; }
  productIndex = (productIndex + 1) % PRODUCTS.length;
  slideIndex = 0;
  renderProduct();
}

function startAuto() {
  if (!autoplay || timer) return;
  timer = setInterval(nextSlide, SLIDE_MS);
}
function stopAuto() {
  autoplay = false;
  clearInterval(timer);
  timer = null;
}

/* ---------- image upload ---------- */

els.upload.addEventListener("change", e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  files.forEach(f => {
    const url = URL.createObjectURL(f);
    uploaded.push(url);
    product().images.push({ src: url, alt: f.name });
  });
  stopAuto();
  renderImages();
  showSlide(product().images.length - files.length);
  e.target.value = "";
});

window.addEventListener("beforeunload", () => uploaded.forEach(URL.revokeObjectURL));

/* ---------- wiring ---------- */

document.getElementById("slide-next").addEventListener("click", () => { stopAuto(); nextSlide(); });
document.getElementById("slide-prev").addEventListener("click", () => { stopAuto(); prevSlide(); });

document.getElementById("qty-up").addEventListener("click", () => {
  els.qty.value = (parseInt(els.qty.value, 10) || 1) + 1;
  updateLinePrice();
});
document.getElementById("qty-down").addEventListener("click", () => {
  els.qty.value = Math.max(1, (parseInt(els.qty.value, 10) || 1) - 1);
  updateLinePrice();
});
els.qty.addEventListener("input", updateLinePrice);

[["wish-top"], ["wish-box"]].forEach(([id]) => {
  const b = document.getElementById(id);
  b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    b.classList.toggle("is-on", on);
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stopAuto(); nextSlide(); }
  if (e.key === "ArrowLeft")  { stopAuto(); prevSlide(); }
});

// hovering the stage holds the current photo without cancelling autoplay
els.stage.addEventListener("mouseenter", () => {
  if (timer) { clearInterval(timer); timer = null; }
});
els.stage.addEventListener("mouseleave", startAuto);

renderProduct();
startAuto();
</script>
</body>
</html>
