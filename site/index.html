<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All — MERO</title>
<meta name="description" content="The full MERO collection — fiberglass planters and outdoor furniture, handmade for indoors and out.">
<link rel="preload" href="assets/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="shell">
  <div class="masthead">
    <button class="icon-btn icon-left" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    </button>
    <a class="logo" href="index.html" aria-label="MERO home">
      <img src="assets/mero-logo.png" alt="MERO">
    </a>
    <button class="icon-btn icon-right" aria-label="Cart">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l1.2 11.5H4.8L6 8Z"/><path d="M9 8V6.2A3 3 0 0 1 15 6.2V8"/></svg>
    </button>
  </div>
  <nav class="nav">
    <a href="?c=outdoor" data-cat="outdoor">OUTDOOR</a>
    <a href="?c=lighting" data-cat="lighting">LIGHTING</a>
    <a href="?c=furniture" data-cat="furniture">FURNITURE</a>
    <a href="?c=decor" data-cat="decor">DECOR</a>
    <a href="?c=sale" data-cat="sale">SALE</a>
  </nav>
</header>

<main class="shell" id="shop">
  <section class="catalogue">
    <div class="catalogue-head">
      <h1 class="catalogue-title" id="cat-title">Shop All</h1>
      <span class="catalogue-count" id="cat-count"></span>
    </div>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script src="data/catalog.js"></script>
<script>
const CATALOG = window.MERO_CATALOG || [];

const CATEGORIES = [
  { id: "all",       label: "Shop All",  match: () => true },
  { id: "outdoor",   label: "Outdoor",   match: p => p.category === "outdoor" },
  { id: "furniture", label: "Furniture", match: p => p.category === "furniture" },
  { id: "lighting",  label: "Lighting",  match: () => false },
  { id: "decor",     label: "Decor",     match: () => false },
  { id: "sale",      label: "Sale",      match: () => false }
];

const els = {
  grid: document.getElementById("grid"),
  filters: document.getElementById("filters"),
  title: document.getElementById("cat-title"),
  count: document.getElementById("cat-count")
};

let category = new URLSearchParams(location.search).get("c") || "all";
if (!CATEGORIES.some(c => c.id === category)) category = "all";

/* The content hash busts the cache when photography is replaced under the
   same filename. */
function photoSrc(product, index) {
  const file = product.images[index];
  if (!file) return null;
  const rev = (product.imageRevs || {})[file];
  return `assets/products/${product.slug}/${file}` + (rev ? `?v=${rev}` : "");
}

function card(product) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = `product.html?p=${encodeURIComponent(product.slug)}`;

  const main = photoSrc(product, 0);
  const alt = photoSrc(product, 1);

  a.innerHTML = `
    <div class="card-media">
      ${main ? `<img src="${main}" alt="${product.title}" loading="lazy">` : ""}
      ${alt ? `<img class="alt" src="${alt}" alt="" loading="lazy">` : ""}
    </div>
    <div class="card-body">
      <div class="card-name">${product.title}</div>
      <div class="card-price">${product.priceRange || product.priceLabel}</div>
      <div class="card-colors">
        ${product.colors.map(c =>
          `<span style="background:${c.hex}" title="${c.name}"></span>`).join("")}
      </div>
    </div>`;
  return a;
}

function renderFilters() {
  els.filters.innerHTML = "";
  CATEGORIES.forEach(c => {
    const count = CATALOG.filter(c.match).length;
    if (!count && c.id !== category) return;      // hide empty shelves
    const b = document.createElement("button");
    b.textContent = c.label;
    b.setAttribute("aria-pressed", String(c.id === category));
    b.addEventListener("click", () => {
      category = c.id;
      history.replaceState(null, "",
        c.id === "all" ? location.pathname : `?c=${c.id}`);
      render();
    });
    els.filters.appendChild(b);
  });
}

function render() {
  const def = CATEGORIES.find(c => c.id === category);
  const items = CATALOG.filter(def.match);

  els.title.textContent = def.label;
  els.count.textContent = items.length
    ? `${items.length} piece${items.length === 1 ? "" : "s"}` : "";
  document.title = `${def.label} — MERO`;

  els.grid.innerHTML = "";
  if (!items.length) {
    els.grid.innerHTML =
      `<p class="empty">No pieces in ${def.label} yet.</p>`;
  } else {
    const frag = document.createDocumentFragment();
    items.forEach(p => frag.appendChild(card(p)));
    els.grid.appendChild(frag);
  }

  [...document.querySelectorAll(".nav a")].forEach(a =>
    a.classList.toggle("is-active", a.dataset.cat === category));
  renderFilters();
}

/* ---------- go ---------- */

render();
</script>
</body>
</html>
